# Faults on critical paths, each caught by a named test with an expected failure message (06/T7, 06/EL4).
# `make mutation` runs them; `make check` runs them at tier E. Add one with every new guard: decisions, money,
# permissions and verdicts. An entry whose `find` no longer matches fails the run, so this list can't go stale quietly.

[[mutation]]
name = "the submitter decides their own work item"
file = "apps/api/src/skeleton_proof_e_next_ai/domain/work_items.py"
find = "if actor == self.submitted_by:"
replace = "if False:"
test = "tests/unit/test_domain.py::test_submitter_cannot_decide_their_own_item"
expect = "DID NOT RAISE"

[[mutation]]
name = "another person's work item is visible (BOLA)"
file = "apps/api/src/skeleton_proof_e_next_ai/application/work_items.py"
find = "or (item.created_by != _owner(principal) and not principal.can(Capability.WORK_ITEM_READ_ALL))"
replace = "or False"
test = "tests/integration/test_api.py::test_bola_another_users_item_is_404_with_the_same_body"
expect = "assert 200 == 404"
lane = "integration"

[[mutation]]
name = "a write without If-Match is accepted"
file = "apps/api/src/skeleton_proof_e_next_ai/api/deps.py"
find = "if if_match is None:"
replace = "if False:"
test = "tests/integration/test_api.py::test_submit_and_approve_need_if_match_and_respect_separation_of_duties"
expect = "428"
lane = "integration"

# Not listed, because removing either alone changes nothing a test can see (defence in depth, found by this check):
# the tenant check in work_items._visible (row-level security already hides other tenants' rows) and the use case's
# version check (the repository's versioned UPDATE refuses the stale write anyway).

[[mutation]]
name = "a citation is not checked against what the model was shown"
file = "apps/api/src/skeleton_proof_e_next_ai/intelligence/validation.py"
find = "            if shown is None:\n                return \"citation_unknown_source\""
replace = "            if False:\n                return \"citation_unknown_source\""
test = "tests/unit/test_ai_steps.py::test_citations_must_quote_the_block_they_name_verbatim"
expect = "citation_unknown_source"

[[mutation]]
name = "an abstention is read as an answer"
file = "apps/api/src/skeleton_proof_e_next_ai/intelligence/steps.py"
find = "if output.abstain is not None:"
replace = "if False:"
test = "tests/unit/test_ai_steps.py::test_an_abstention_is_recorded_as_itself_even_beside_content"
expect = "abstained"

[[mutation]]
