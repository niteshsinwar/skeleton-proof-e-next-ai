[[mutation]]
name = "late output from a superseded run is not fenced"
file = "apps/api/src/skeleton_proof_e_next_ai/persistence/ai_records.py"
find = "        await self.conn.execute(select(func.pg_advisory_xact_lock(func.hashtextextended(subject, 0))))\n"
replace = ""
test = "tests/integration/test_ai_records.py::test_a_late_run_sees_the_newer_one_even_when_they_finish_together"
expect = "there is no fence"
lane = "integration"

[[mutation]]
name = "a use case scans model prose with a regular expression"
file = "apps/api/src/skeleton_proof_e_next_ai/application/ai_runs.py"
find = "from __future__ import annotations\n"
replace = "from __future__ import annotations\n\nimport re  # noqa: F401\n"
test = "tests/invariants/test_structure.py::test_no_decision_is_read_out_of_model_prose"
expect = "use regular expressions without a reason"

[[mutation]]
name = "a judge's verdict is taken in one order only"
file = "evals/harness/graders.py"
find = "    if _SWAPPED[two] != one:"
replace = "    if False:"
test = "../../evals/harness/tests/test_selftest.py::test_a_judge_sees_both_orders_and_position_bias_counts_for_neither"
expect = "'inconsistent'"

[[mutation]]
name = "search ranks chunks the caller's roles may not see"
file = "apps/api/src/skeleton_proof_e_next_ai/persistence/documents.py"
find = "func.cardinality(chunks.c.allowed_roles) == 0, chunks.c.allowed_roles.overlap(sorted(scope.roles))"
replace = "func.cardinality(chunks.c.allowed_roles) >= 0"
test = "tests/integration/test_retrieval_api.py::test_restricted_documents_are_never_candidates_for_other_roles"
expect = "'Pay'"
lane = "integration"

[[mutation]]
