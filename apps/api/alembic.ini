# Migrations are an explicit step, run before new code takes traffic (07/O2). The URL comes from
# APP_DATABASE_URL (see src/skeleton_proof_e_next_ai/persistence/migrations/env.py), never from this file.
[alembic]
script_location = src/skeleton_proof_e_next_ai/persistence/migrations
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %%(levelname)s %%(name)s %%(message)s
