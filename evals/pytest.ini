# The eval suite (06 §2), run from apps/api so it uses the backend's environment:
#   make eval-selftest   the harness's own tests, offline, inside `make check`
#   make eval            every released dataset, LIVE (needs the provider's key, EVAL_LIVE=1 and APP_DATABASE_URL)
[pytest]
pythonpath = . ../apps/api/src
addopts = -q --strict-markers -p no:cacheprovider
markers =
    eval: a real-model eval run (06/E4)
