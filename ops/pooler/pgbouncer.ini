; PgBouncer for the pooler proof (01/R7): transaction pooling with protocol-level prepared statements tracked.
; Local-only credentials (userlist.txt); a real deployment configures its own pooler from its own secrets.
[databases]
app = host=postgres port=5432 dbname=app

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = app_owner
pool_mode = transaction
; > 0 makes PgBouncer track psycopg's prepared statements across server connections; 0 breaks them (01/R7, W61).
max_prepared_statements = 200
; Few server connections, so the test's clients must share them and every statement has to be tracked.
default_pool_size = 2
max_client_conn = 100
