# The pinned tools every gate uses, the same on a laptop and in CI (13/V3, V4, SK8). `make tools` installs them into
# .tools/ (gitignored), verifying each download against the sha256 written here; a mismatch or a missing checksum
# stops the install. Python tools run through `uvx` at the pinned version under the uv cooldown instead.
# Each release was at least 7 days old when pinned (2026-11-05); Renovate proposes updates after the same window.

[binary.gitleaks]
version = "8.30.1"
url = "https://github.com/gitleaks/gitleaks/releases/download/v{version}/gitleaks_{version}_{platform}.tar.gz"
platforms = { darwin-arm64 = "darwin_arm64", linux-x64 = "linux_x64" }
sha256 = { darwin-arm64 = "b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5", linux-x64 = "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" }

